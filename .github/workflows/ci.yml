name: CI

on:
  # Branches are tested through their pull requests; main after merging
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
  # No path filter on xhandler/: these jobs are required checks, so they must report on every PR
  pull_request:
    paths-ignore:
      - "README.md"

# A new push to a pull request cancels the run of the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  jvm-tests:
    name: JVM Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Maven
        run: mvn verify -pl searchpe

  native-tests:
    name: Native Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Build with Maven
        run: mvn verify -pl searchpe -Dquarkus.native.container-build=true -P native

  # The unified UI (ui/); a required check, so it runs on every change
  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # npm ci runs `prepare`, which generates the API clients from client/openapi/
      - run: npm ci
      # The type check needs the built common package and the generated route tree
      - run: npm run build
      - run: npm run lint
      - run: npm run format
      - run: npx playwright install --with-deps chromium
      - name: Test
        run: npm test
        env:
          CI: "1"

  operator-tests:
    name: Operator Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          # The same as GOLANGCI_LINT_VERSION in operator/Makefile
          version: v2.15.0
          working-directory: operator
      - run: make verify-generated test
      # The checks both catalogs run on a bundle (check_osdk_bundle_validate_*), as the release does
      - uses: ./.github/actions/setup-operator-sdk
      - name: Bundle
        run: make bundle bundle-validate

  application-container:
    name: Application container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Build container image
        run: |
          mvn -U -B package --file pom.xml -DskipTests \
          -Dquarkus.native.container-build=true \
          -Dquarkus.container-image.push=false \
          -Dquarkus.container-image.build=true \
          -Dquarkus.container-image.registry=localhost:5000 \
          -Dquarkus.container-image.group="" \
          -Dquarkus.container-image.name=searchpe \
          -Dquarkus.container-image.tag=0.0.0 \
          -P native \
          -pl searchpe
      - name: Save container image
        run: docker save -o searchpe-application-container-image.tar localhost:5000/searchpe:0.0.0
      - name: Upload container image
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-application
          path: searchpe-application-container-image.tar

  xhandler-ui-container:
    name: xhandler-ui container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build container image
        run: docker build -t localhost:5000/xhandler-ui:0.0.0 ui
      - name: Save container image
        run: docker save -o xhandler-ui-container-image.tar localhost:5000/xhandler-ui:0.0.0
      - name: Upload container image
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-xhandler-ui
          path: xhandler-ui-container-image.tar

  operator-container:
    name: Operator container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build container image
        run: docker build -t localhost:5000/searchpe-operator:0.0.0 operator
      - name: Save container image
        run: docker save -o searchpe-operator-container-image.tar localhost:5000/searchpe-operator:0.0.0
      - name: Upload container image
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-operator
          path: searchpe-operator-container-image.tar

  catalog-container:
    name: Catalog container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum
      - name: Setup OLM CLIs
        run: |
          export ARCH=$(case $(uname -m) in x86_64) echo -n amd64 ;; aarch64) echo -n arm64 ;; *) echo -n $(uname -m) ;; esac)
          export OS=$(uname | awk '{print tolower($0)}')
          
          # Opm
          export OPERATOR_SDK_DL_URL=https://github.com/operator-framework/operator-registry/releases/download/v1.26.2
          curl -sSfLO ${OPERATOR_SDK_DL_URL}/${OS}-${ARCH}-opm
          chmod +x ${OS}-${ARCH}-opm && sudo mv ${OS}-${ARCH}-opm /usr/local/bin/opm
      - uses: ./.github/actions/setup-operator-sdk
      # Operator Tests validates the bundle
      - name: Bundle
        working-directory: operator
        run: |
          make bundle bundle-build IMG=localhost:5000/searchpe-operator:0.0.0 SEARCHPE_IMAGE=localhost:5000/searchpe:0.0.0 \
            BUNDLE_IMG=localhost:5000/searchpe-operator-bundle:0.0.0
      - name: Init local Registry
        run: |
          docker run -d -p 5000:5000 --name registry registry:2
          sleep 5
      - name: Create bundle image
        run: |
          # Bundle
          BUNDLE_IMAGE=localhost:5000/searchpe-operator-bundle:0.0.0
          docker push $BUNDLE_IMAGE
          
          # Catalog
          CATALOG_IMAGE=localhost:5000/searchpe-operator-catalog:0.0.0
          opm index add --bundles $BUNDLE_IMAGE --tag $CATALOG_IMAGE --use-http --build-tool docker

          # Save container images
          docker save -o searchpe-bundle-container-image.tar $BUNDLE_IMAGE
          docker save -o searchpe-catalog-container-image.tar $CATALOG_IMAGE
      - name: Upload container image
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-catalog
          path: |
            searchpe-bundle-container-image.tar
            searchpe-catalog-container-image.tar

  ui-e2e-tests:
    needs: [ application-container, operator-container, catalog-container, xhandler-ui-container ]
    name: UI E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Setup Minikube
        uses: manusa/actions-setup-minikube@v2.19.0
        with:
          minikube version: v1.39.0
          kubernetes version: v1.37.2
          start args: --insecure-registry "10.0.0.0/24" --addons=registry,ingress
          github token: ${{ secrets.GITHUB_TOKEN }}
      - name: Load and config images
        run: |
          docker load -i artifacts/searchpe-application-container-image.tar
          docker load -i artifacts/searchpe-operator-container-image.tar
          docker load -i artifacts/searchpe-bundle-container-image.tar
          docker load -i artifacts/searchpe-catalog-container-image.tar
          docker load -i artifacts/xhandler-ui-container-image.tar
      - name: Configure Minikube
        run: |
          # Install OLM
          curl -sL https://github.com/operator-framework/operator-lifecycle-manager/releases/download/v0.46.0/install.sh | bash -s v0.46.0
          
          # Load images
          minikube image load localhost:5000/searchpe:0.0.0
          minikube image load localhost:5000/searchpe-operator:0.0.0
          minikube image load localhost:5000/searchpe-operator-bundle:0.0.0
          minikube image load localhost:5000/searchpe-operator-catalog:0.0.0
          minikube image load localhost:5000/xhandler-ui:0.0.0
          
          # Push images to internal registry
          docker push localhost:5000/searchpe:0.0.0
          docker push localhost:5000/searchpe-operator:0.0.0
          docker push localhost:5000/searchpe-operator-bundle:0.0.0
          docker push localhost:5000/searchpe-operator-catalog:0.0.0
          docker push localhost:5000/xhandler-ui:0.0.0
      - name: Install Searchpe operator
        timeout-minutes: 10
        run: |
          kubectl create ns openubl
          
          # Create custom catalog         
          kubectl create -f scripts/searchpe-operator.yaml
          kubectl get pods -n olm --selector=olm.catalogSource=searchpe-catalog-source
          
          # Verify subscription
          kubectl get csv -n olm
      - name: Install Postgresql Operator
        timeout-minutes: 10
        run: |
          kubectl create -f https://operatorhub.io/install/postgresql.yaml
          
          PHASE=""
          while [ "$PHASE" != "Succeeded" ]
          do
            PHASE=$(kubectl get csv -n operators -o jsonpath="{$.items[*].status.phase}")
            echo "Waiting for postgresql csv. Current phase=$PHASE"
            sleep 10;
          done
      - name: Install DB
        timeout-minutes: 10
        run: |
          kubectl -n openubl apply -f scripts/postgresql.yaml
          
          POD_COUNT=0
          while [ $POD_COUNT -le 3 ]
          do
            POD_COUNT=$(kubectl get pods -n openubl -o name | wc -l)
            echo "Waiting for pods to exists. Current count=$POD_COUNT"
            sleep 10;
          done
          echo "Resources exists, now wait for them to be ready"

          kubectl wait pods -l "postgres-operator.crunchydata.com/data"="pgbackrest" -n openubl --for condition=Ready --timeout=8m
          kubectl wait pods -l "postgres-operator.crunchydata.com/data"="postgres" -n openubl --for condition=Ready --timeout=8m
      - name: Install Searchpe
        timeout-minutes: 10
        run: |
          kubectl -n openubl apply -f scripts/searchpe.yaml
          sleep 10;
          
          kubectl wait pods --selector "app.kubernetes.io/name"="searchpe" -n openubl --for condition=Ready --timeout=8m

          external_ip=""
          while [[ -z $external_ip ]]
          do
            external_ip=$(kubectl get ingress searchpe-searchpe-ingress --template="{{range.status.loadBalancer.ingress}}{{.ip}}{{end}}" -n openubl);
            echo "Waiting for end point...current=$external_ip"
            sleep 10;
          done

          echo "End point ready: $external_ip"
          echo "SEARCHPE_URL=https://$(minikube ip)" >> $GITHUB_ENV
      # searchpe serves only its API now: the UI is ui/, deployed by the XHandler kind
      - name: Searchpe API smoke test
        timeout-minutes: 10
        run: |
          for i in $(seq 1 30); do curl -fsk "$SEARCHPE_URL/q/health/ready" && break; sleep 10; done
          curl -fsk "$SEARCHPE_URL/q/health/ready" | grep -q '"status": *"UP"'
          curl -fsk "$SEARCHPE_URL/api/versions" -H 'Accept: application/json' | jq -e 'type == "array"'
      - name: Install XHandler
        timeout-minutes: 10
        run: |
          kubectl -n openubl apply -f scripts/xhandler.yaml
          for i in $(seq 1 30); do kubectl -n openubl get deployment xhandler-ui && break; sleep 10; done
          kubectl -n openubl rollout status deployment/xhandler-ui --timeout=8m
          kubectl -n openubl wait pods -l app.kubernetes.io/name=xhandler-ui --for condition=Ready --timeout=5m
          # nginx serves the host only once the Ingress has an address
          for i in $(seq 1 30); do
            [ -n "$(kubectl -n openubl get ingress xhandler-xhandler -o jsonpath='{.status.loadBalancer.ingress[0].ip}')" ] && break
            sleep 10
          done
          kubectl -n openubl get ingress xhandler-xhandler
          kubectl -n openubl get job -l app.kubernetes.io/name=xhandler-migrate
      # The single UI, through the XHandler's Ingress: its shell, and searchpe through its proxy
      - name: UI smoke test
        timeout-minutes: 10
        run: |
          UI="http://$(minikube ip)"
          check() { # check <path> <test on the body>
            for i in $(seq 1 30); do
              body=$(curl -fsS -H "Host: xhandler.local" -H 'Accept: application/json, text/html' "$UI$1") && eval "$2" <<<"$body" && return 0
              sleep 5
            done
            echo "::error::$1 failed"; curl -sS -i -H "Host: xhandler.local" "$UI$1" | head -40; return 1
          }
          check /healthz 'true'
          check / 'grep -q "id=\"root\""'
          check /api/searchpe/versions 'jq -e "type == \"array\""'
      - name: Dump cluster state
        if: failure()
        run: |
          kubectl get csv,subscription,installplan -A || true
          kubectl get postgrescluster,searchpe,xhandler,all,pvc,ingress,job -n openubl -o wide || true
          kubectl describe xhandler -n openubl || true
          kubectl describe postgrescluster -n openubl || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -100 || true
          kubectl logs -n operators -l postgres-operator.crunchydata.com/control-plane --tail=100 || true
          kubectl logs -n olm -l olm.catalogSource=searchpe-catalog-source --tail=50 || true
          kubectl logs -n openubl -l app.kubernetes.io/name=searchpe-operator --tail=100 || true
          kubectl logs -n openubl --all-containers --prefix -l app.kubernetes.io/name=searchpe --tail=100 || true
          kubectl logs -n openubl --all-containers --prefix -l app.kubernetes.io/name=xhandler-ui --tail=100 || true
