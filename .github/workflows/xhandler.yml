# xhandler-service (xhandler/): the app, the engine, their images and the Kustomize base
name: xhandler

on:
  push:
    branches: [main]
    paths: ["xhandler/**", "hack/**", ".github/workflows/xhandler.yml"]
  pull_request:
    paths: ["xhandler/**", "hack/**", ".github/workflows/xhandler.yml"]

env:
  CI: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Tests use Dev Services: Testcontainers starts PostgreSQL on the runner's Docker
      - run: ./mvnw -B verify
        working-directory: xhandler

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xhandler/engine
    steps:
      - uses: actions/checkout@v7.0.1
      # libxml2 for XSD validation (the libxml crate generates its bindings with libclang)
      - run: sudo apt-get update && sudo apt-get install -y libxml2-dev libclang-dev pkg-config
      # Installs the toolchain of engine/rust-toolchain.toml
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: xhandler/engine
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  images:
    runs-on: ubuntu-latest
    needs: [app, engine]
    defaults:
      run:
        working-directory: xhandler
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B -q package -DskipTests
      - run: docker build -f app/src/main/docker/Dockerfile.jvm -t xhandler-service:ci app
      - run: docker build -t xhandler-engine:ci engine
      # Smoke test: the image must serve and its exec probe must pass
      - run: |
          docker run -d --name engine --network host -e XHANDLER_ENGINE_ADDR=127.0.0.1:8090 xhandler-engine:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8090/health && break; sleep 1; done
          docker exec engine /usr/local/bin/xhandler-engine --health
          curl -fs -X POST http://127.0.0.1:8090/v1/build -H 'content-type: application/json' \
            -d "{\"document\": $(cat examples/invoice.json)}" | grep -q '<cbc:ID>F001-1</cbc:ID>'
      # Publishing and signing images belongs to the infrastructure track (DESIGN.md §21.4)

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: kubectl kustomize xhandler/deploy/base > /dev/null && kubectl kustomize xhandler/deploy/monitoring > /dev/null
