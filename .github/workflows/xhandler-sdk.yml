name: xhandler SDKs

on:
  push:
    branches: [main]
    paths: ["xhandler/app/src/main/java/**", "xhandler/sdk/**", ".github/workflows/xhandler-sdk.yml"]

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xhandler
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: ./mvnw -B -q -pl app package -DskipTests
      - run: ./sdk/generate.sh
      - uses: actions/upload-artifact@v5
        with:
          name: sdks
          path: |
            xhandler/sdk/typescript
            xhandler/sdk/java
            xhandler/app/target/openapi
