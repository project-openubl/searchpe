# The unified UI (ui/): its image
name: ui

on:
  push:
    branches: [main]
    paths: ["ui/**", ".github/workflows/ui.yml"]
  pull_request:
    paths: ["ui/**", ".github/workflows/ui.yml"]

jobs:
  # Lint, build and unit tests are ci.yml's "UI Tests" (a required check)
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t xhandler-ui:ci ui
      # Smoke test: the server starts with the required settings and answers its health check
      - run: |
          docker run -d --name ui -p 8080:8080 \
            -e XHANDLER_API_URL=http://127.0.0.1:9 -e OIDC_SERVER_URL=http://127.0.0.1:9/realms/xhandler xhandler-ui:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/ | grep -q '<div id="root"'
