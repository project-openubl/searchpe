name: Release

# Runs when a release is published. release-tools' release-searchpe workflow creates the release
# (tag and notes) once CI passed on the commit, waits for this workflow and then opens the
# OperatorHub pull requests from the bundle attached here.
#
# The tag is the version: the poms on main keep a development version and every job sets the
# tag's. Publishes:
# - ghcr.io/project-openubl/searchpe/searchpe and searchpe-operator, native, for amd64 and arm64:
#   vX.Y.Z always; latest and vX only for the highest stable release (of its major for vX).
# - release assets: the JVM distribution, the OpenAPI schema, the operator bundle and SHA256SUMS.
#
# Running it again for the same tag is safe: images already pushed are kept and the assets are
# replaced. To retry with a fixed workflow, dispatch it from main with the tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish again, e.g. v4.2.0"
        required: true
        type: string

# release-tools finds the run of a release by this name
run-name: Release ${{ github.event.release.tag_name || inputs.tag }}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  REGISTRY: ghcr.io/project-openubl/searchpe

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Version
        id: version
        run: |
          version_re='^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$'
          if [[ ! "$TAG" =~ $version_re ]]; then
            echo "::error::$TAG is not vX.Y.Z or vX.Y.Z-alpha.N, -beta.N, -rc.N"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  images:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        image: [searchpe, searchpe-operator]
        arch: [amd64, arm64]
        include:
          - image: searchpe
            module: application
            profiles: native,ui
          - image: searchpe-operator
            module: operator
            profiles: native
          - arch: amd64
            runner: ubuntu-latest
          # Native images are built for the runner's architecture
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      IMAGE: ghcr.io/project-openubl/searchpe/${{ matrix.image }}:${{ github.event.release.tag_name || inputs.tag }}-${{ matrix.arch }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Already pushed?
        id: pushed
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::notice::$IMAGE is already pushed"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ !steps.pushed.outputs.pushed }}
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - if: ${{ !steps.pushed.outputs.pushed }}
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - if: ${{ !steps.pushed.outputs.pushed }}
        run: mvn -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      - name: Build ${{ env.IMAGE }}
        if: ${{ !steps.pushed.outputs.pushed }}
        env:
          MODULE: ${{ matrix.module }}
          PROFILES: ${{ matrix.profiles }}
          ARCH: ${{ matrix.arch }}
          NAME: ${{ matrix.image }}
        run: |
          mvn -U -B package -DskipTests \
            -Dquarkus.native.container-build=true \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=false \
            -Dquarkus.container-image.registry=ghcr.io \
            -Dquarkus.container-image.group=project-openubl \
            -Dquarkus.container-image.name="searchpe/$NAME" \
            -Dquarkus.container-image.tag="$TAG-$ARCH" \
            -Dquarkus.jib.platforms="linux/$ARCH" \
            -Doperator.searchpe.image="$REGISTRY/searchpe:$TAG" \
            -P "$PROFILES" \
            -pl "$MODULE"
      - if: ${{ !steps.pushed.outputs.pushed }}
        run: docker push "$IMAGE"

  manifests:
    needs: [prepare, images]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        image: [searchpe, searchpe-operator]
    # One release at a time moves the floating tags of an image, from the tags that exist then
    concurrency:
      group: floating-tags-${{ matrix.image }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Pre-releases and patches of older lines don't move latest or vX
      - name: Floating tags
        id: floating
        run: |
          stable_re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          floating=""
          if [[ "$TAG" =~ $stable_re ]]; then
            major=$(cut -d. -f1 <<< "$TAG")
            tags=$(git ls-remote --tags --refs "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" 'v*' |
              sed 's#.*refs/tags/##' | grep -E "$stable_re" || true)
            stable=$(printf '%s\n' "$tags" "$TAG" | sed '/^$/d' | sort -uV)
            if [ "$(tail -1 <<< "$stable")" = "$TAG" ]; then
              floating+=" latest"
            fi
            if [ "$(grep "^$major\." <<< "$stable" | tail -1)" = "$TAG" ]; then
              floating+=" $major"
            fi
          fi
          echo "floating=${floating# }" >> "$GITHUB_OUTPUT"
          echo "::notice::$TAG moves: ${floating:-no floating tags}"
      - name: Multi-arch ${{ matrix.image }}:${{ env.TAG }}
        env:
          NAME: ${{ matrix.image }}
          FLOATING: ${{ steps.floating.outputs.floating }}
        run: |
          image="$REGISTRY/$NAME"
          tags=(-t "$image:$TAG")
          for floating in $FLOATING; do
            tags+=(-t "$image:$floating")
          done
          docker buildx imagetools create "${tags[@]}" "$image:$TAG-amd64" "$image:$TAG-arm64"
          docker buildx imagetools inspect "$image:$TAG"

  assets:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      # Release assets
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Setup groovy
        run: sudo apt-get update -q && sudo apt-get install -y groovy
      - run: mvn -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      - run: mkdir dist
      - name: Distribution and OpenAPI schema
        run: |
          mvn -B package -DskipTests -P ui,distribution -pl application \
            -Dquarkus.smallrye-openapi.store-schema-directory=target/openapi
          cp "application/target/distributions/searchpe-$VERSION.tar.gz" "application/target/distributions/searchpe-$VERSION.zip" dist/
          cp application/target/openapi/openapi.yaml dist/
      # The bundle the catalogs get: release-tools sets spec.replaces for each catalog
      - name: Operator bundle
        run: |
          mvn -B package -DskipTests \
            -Dquarkus.container-image.registry=ghcr.io \
            -Dquarkus.container-image.group=project-openubl \
            -Dquarkus.container-image.name=searchpe/searchpe-operator \
            -Dquarkus.container-image.tag="$TAG" \
            -Doperator.searchpe.image="$REGISTRY/searchpe:$TAG" \
            -Dquarkus.operator-sdk.bundle.package-name=searchpe-operator \
            -Dquarkus.operator-sdk.bundle.channels=alpha \
            -Dquarkus.application.version="$VERSION" \
            -pl operator
          csv=operator/target/bundle/searchpe-operator/manifests/searchpe-operator.clusterserviceversion.yaml
          groovy scripts/enrichCSV.groovy "$csv" "$VERSION"
          sed -i "/  annotations: ''/d" "$csv"
          grep -q "image: $REGISTRY/searchpe-operator:$TAG" "$csv" || {
            echo "::error::The CSV does not deploy $REGISTRY/searchpe-operator:$TAG"
            exit 1
          }
      # The checks both catalogs run on a bundle (check_osdk_bundle_validate_*)
      - name: Validate the operator bundle
        env:
          OPERATOR_SDK_VERSION: v1.42.3
          OPERATOR_SDK_SHA256: 887a3bb0d63ccc4ca47a522d0c8ffac56d9d5246f6a2bd886b4ed23eb2e2672f
        run: |
          curl -sSfLo "$RUNNER_TEMP/operator-sdk" \
            "https://github.com/operator-framework/operator-sdk/releases/download/$OPERATOR_SDK_VERSION/operator-sdk_linux_amd64"
          echo "$OPERATOR_SDK_SHA256  $RUNNER_TEMP/operator-sdk" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/operator-sdk"
          bundle=operator/target/bundle/searchpe-operator
          "$RUNNER_TEMP/operator-sdk" bundle validate "$bundle" --select-optional name=operatorhub
          "$RUNNER_TEMP/operator-sdk" bundle validate "$bundle" --select-optional suite=operatorframework
          tar -C operator/target/bundle -czf "dist/searchpe-operator-bundle-$VERSION.tar.gz" searchpe-operator
      - name: Upload the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
          gh release upload "$TAG" dist/* --clobber

  summary:
    needs: [prepare, manifests, assets]
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "# searchpe $TAG"
            echo
            echo "- \`$REGISTRY/searchpe:$TAG\`, \`$REGISTRY/searchpe-operator:$TAG\` (amd64, arm64)"
            echo "- Release assets: the distribution, the OpenAPI schema and the operator bundle (release-tools opens the OperatorHub pull requests from it)"
          } >> "$GITHUB_STEP_SUMMARY"
