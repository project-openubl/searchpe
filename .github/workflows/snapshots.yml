name: Snapshots

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs: { }

env:
  CI: true

jobs:
  linux-jvm-tests:
    if: ${{ github.event_name != 'pull_request' && github.repository_owner == 'project-openubl' }}
    name: Test real padron reducido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Maven
        run: mvn test -f searchpe -Dtest=DataHelperTest -Dsearchpe.sunat.padronReducidoUrl=http://www2.sunat.gob.pe/padron_reducido_ruc.zip

  application-container:
    needs: [ linux-jvm-tests ]
    name: Application container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Build container image
        run: |
          mvn -U -B package --file pom.xml -DskipTests \
          -Dquarkus.native.container-build=true \
          -Dquarkus.container-image.push=false \
          -Dquarkus.container-image.build=true \
          -Dquarkus.container-image.registry=ghcr.io \
          -Dquarkus.container-image.group=project-openubl \
          -Dquarkus.container-image.name=xhandler-service/searchpe \
          -Dquarkus.container-image.tag=nightly \
          -P native \
          -pl searchpe
      - name: Save container image
        run: docker save -o searchpe-container-image.tar ghcr.io/project-openubl/xhandler-service/searchpe:nightly
      - name: Upload container image
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-application
          path: searchpe-container-image.tar

  operator-container:
    name: Operator container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build container image
        run: docker build -t ghcr.io/project-openubl/xhandler-service/searchpe-operator:nightly operator
      - name: Save container image
        run: docker save -o searchpe-operator-container-image.tar ghcr.io/project-openubl/xhandler-service/searchpe-operator:nightly
      - name: Upload container image
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-operator
          path: searchpe-operator-container-image.tar

  xhandler-containers:
    name: xhandler containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Build container images
        run: |
          (cd xhandler && ./mvnw -B -q package -DskipTests -pl app -am)
          docker build -f xhandler/app/src/main/docker/Dockerfile.jvm -t ghcr.io/project-openubl/xhandler-service/xhandler-service:nightly xhandler/app
          docker build -t ghcr.io/project-openubl/xhandler-service/xhandler-engine:nightly xhandler/engine
          docker build -t ghcr.io/project-openubl/xhandler-service/xhandler-ui:nightly ui
      - name: Save container images
        run: |
          docker save -o xhandler-container-images.tar ghcr.io/project-openubl/xhandler-service/xhandler-service:nightly \
            ghcr.io/project-openubl/xhandler-service/xhandler-engine:nightly ghcr.io/project-openubl/xhandler-service/xhandler-ui:nightly
      - name: Upload container images
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-xhandler
          path: xhandler-container-images.tar

  publish-container:
    needs: [ application-container, operator-container, xhandler-containers ]
    name: Publish container
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Login to Ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load images
        run: |
          docker load -i artifacts/searchpe-container-image.tar
          docker load -i artifacts/searchpe-operator-container-image.tar
          docker load -i artifacts/xhandler-container-images.tar
      - name: Push images to registry
        run: |
          docker push ghcr.io/project-openubl/xhandler-service/searchpe:nightly
          docker push ghcr.io/project-openubl/xhandler-service/searchpe-operator:nightly
          docker push ghcr.io/project-openubl/xhandler-service/xhandler-service:nightly
          docker push ghcr.io/project-openubl/xhandler-service/xhandler-engine:nightly
          docker push ghcr.io/project-openubl/xhandler-service/xhandler-ui:nightly
