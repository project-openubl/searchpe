version: 2

# Dependabot PRs are auto-approved and auto-merged once CI passes
# (.github/workflows/auto-merge-dependabot.yaml), so the cooldown keeps freshly published
# (possibly compromised) releases out; security updates skip it.
# Groups take minor/patch only, so a breaking major arrives as its own PR.
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        update-types: ["minor", "patch"]

  # Maintain dependencies for pom.xml
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      maven:
        update-types: ["minor", "patch"]

  # Maintain dependencies for xhandler/pom.xml
  - package-ecosystem: "maven"
    directory: "/xhandler"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      maven:
        update-types: ["minor", "patch"]

  # Maintain dependencies for xhandler/engine/Cargo.toml (xhandler-rust is pinned by revision on purpose)
  - package-ecosystem: "cargo"
    directory: "/xhandler/engine"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "xhandler"
    groups:
      cargo:
        update-types: ["minor", "patch"]

  # Maintain dependencies for operator/go.mod
  - package-ecosystem: "gomod"
    directory: "/operator"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # The Kubernetes libraries and controller-runtime are released together and must move together
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
        update-types: ["minor", "patch"]
      gomod:
        update-types: ["minor", "patch"]

  # Maintain the base images of operator/Dockerfile
  - package-ecosystem: "docker"
    directory: "/operator"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker:
        update-types: ["minor", "patch"]

  # Maintain dependencies from package.json
  - package-ecosystem: "npm"
    directory: "/searchpe/src/main/webapp"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: "chore"
      include: "scope"
    allow:
      - dependency-name: "@patternfly/*"
        dependency-type: "direct"
      - dependency-name: "cypress"
        dependency-type: "direct"
      - dependency-name: "@cypress/*"
        dependency-type: "direct"
