version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  exclusions:
    generated: strict
    presets:
      - comments
      - std-error-handling
formatters:
  enable:
    - gofmt
    - goimports
