apiVersion: v1
kind: Namespace
metadata:
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searchpe-operator
  namespace: system
  labels:
    app.kubernetes.io/name: searchpe-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: searchpe-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searchpe-operator
    spec:
      serviceAccountName: searchpe-operator
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          # make bundle and make deploy set the images
          image: searchpe-operator
          args:
            - --leader-elect
          env:
            # The operator reconciles the Searchpe of its namespace (OLM's OwnNamespace install mode)
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RELATED_IMAGE_SEARCHPE
              value: searchpe
            - name: RELATED_IMAGE_XHANDLER
              value: xhandler-service
            - name: RELATED_IMAGE_XHANDLER_ENGINE
              value: xhandler-engine
            - name: RELATED_IMAGE_XHANDLER_UI
              value: xhandler-ui
            - name: RELATED_IMAGE_EGRESS_PROXY
              value: egress-proxy
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
