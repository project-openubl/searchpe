# End-to-end against SUNAT beta. SUNAT beta is flaky, so this runs nightly and
# on demand instead of gating pull requests (DESIGN.md §15.2).
name: E2E (SUNAT beta)

on:
  schedule:
    - cron: "0 9 * * *" # 04:00 in Lima
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: cd engine && (rustup show active-toolchain || rustup toolchain install)
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: engine
      - run: COMPOSE="docker compose" ./hack/e2e.sh
