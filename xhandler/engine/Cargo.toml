[package]
name = "xhandler-engine"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Stateless sidecar of xhandler-service: builds, signs and sends SUNAT documents with xhandler-rust"
default-run = "xhandler-engine"

[dependencies]
# Pinned by revision (DESIGN.md §26.3). Points at the fork commit with the
# two-step signing (R1) until project-openubl/xhandler-rust#610 is merged.
# build.rs reads this rev for GET /v1/info.
xhandler = { git = "https://github.com/carlosthe19916/xhandler-rust", rev = "56ea4775f23eef46350edc43c7a04ebd1e4500fc" }

anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures-util = { version = "0.3", default-features = false }
# XSD validation (DESIGN.md §19 R5): libxml2, the validator xhandler-rust's tests use
libxml = "0.3"
opentelemetry = "0.33"
opentelemetry-http = "0.33"
opentelemetry-otlp = "0.33"
opentelemetry_sdk = "0.33"
quick-xml = "0.39"
regex = "1"
# SUNAT's REST APIs for SIRE and conformity (§11.7, §11.8): the same version
# and features as xhandler-rust, so no new crates
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
# Same version and features as xhandler-rust (zips for SUNAT and the fake's CDRs)
zip = { version = "7", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
