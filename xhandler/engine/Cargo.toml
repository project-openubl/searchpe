[package]
name = "xhandler-engine"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Stateless sidecar of xhandler-service: builds, signs and sends SUNAT documents with xhandler-rust"

[dependencies]
# Pinned by revision; bumping it is its own PR (DESIGN.md §26.3)
xhandler = { git = "https://github.com/project-openubl/xhandler-rust", rev = "fdefe29adc3779293d6aea2238b8a37e8349219d" }

anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
opentelemetry = "0.33"
opentelemetry-http = "0.33"
opentelemetry-otlp = "0.33"
opentelemetry_sdk = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
