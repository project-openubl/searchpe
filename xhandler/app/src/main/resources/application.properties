quarkus.application.name=xhandler-service

# JSON is snake_case everywhere, like xhandler-rust's models
quarkus.jackson.property-naming-strategy=SNAKE_CASE

# Rust engine sidecar (same pod, localhost).
# Timeouts nest: app read-timeout > engine's SUNAT timeout (xsender: 120 s), so the app never
# gives up on a send the engine may still complete.
quarkus.rest-client.engine.url=${XHANDLER_ENGINE_URL:http://localhost:8090}
quarkus.rest-client.engine.connect-timeout=2000
quarkus.rest-client.engine.read-timeout=130000

# Let in-flight requests (up to a full SUNAT call) finish on shutdown. The pod's
# terminationGracePeriodSeconds must be larger (deploy/base/deployment.yaml).
quarkus.shutdown.timeout=135s

# Database (Dev Services starts PostgreSQL in dev and test). The app runs as the
# non-owner role xhandler_app so row-level security applies (TenantRlsInterceptor).
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
# Production: the app logs in as a non-owner role (DatabaseRoleCheck); migrations use the owner:
#   QUARKUS_FLYWAY_USERNAME / QUARKUS_FLYWAY_PASSWORD, or migrate-at-start=false and a migration job
quarkus.hibernate-orm.database.default-schema=xhandler
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
# JSON columns (audit_log.details) use Hibernate's own mapper, not the REST one (snake_case)
quarkus.hibernate-orm.mapping.format.global=ignore

# Identity: Keycloak (OIDC). Dev Services start Keycloak with the dev realm in dev and test.
quarkus.oidc.application-type=service
quarkus.oidc.client-id=xhandler-service
# Only tokens issued for this API (Keycloak audience mapper on each client that calls it)
quarkus.oidc.token.audience=xhandler-service
%dev.quarkus.oidc.credentials.secret=secret
%test.quarkus.oidc.credentials.secret=secret
quarkus.keycloak.devservices.realm-path=../deploy/keycloak/xhandler-realm-dev.json
quarkus.keycloak.devservices.realm-name=xhandler
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated

# Key vault (DESIGN.md §6): an HSM through PKCS#11 in production
#   xhandler.vault.pkcs11.library, xhandler.vault.pkcs11.pin, xhandler.vault.pkcs11.slot-list-index
xhandler.vault.kind=pkcs11
# Development and tests: software vault with fixed, public master keys. Never in production.
%dev.xhandler.vault.kind=software
%dev.xhandler.vault.software.current-master-key=dev-1
%dev.xhandler.vault.software.master-keys.dev-1=ZGV2LW1hc3Rlci1rZXktMDAwMDAwMDAwMDAwMDAwMDA=
%test.xhandler.vault.kind=software
%test.xhandler.vault.software.current-master-key=test-2
%test.xhandler.vault.software.master-keys.test-1=dGVzdC1tYXN0ZXIta2V5LTEtMDAwMDAwMDAwMDAwMDA=
%test.xhandler.vault.software.master-keys.test-2=dGVzdC1tYXN0ZXIta2V5LTItMDAwMDAwMDAwMDAwMDA=

# Logs: JSON in production (with trace and span ids), plain text in dev and tests
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

# Observability: OTLP to the collector (hack/compose.yaml in development)
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
%test.quarkus.otel.sdk.disabled=true

# Tests share a few fixed users, so they need room for more unverified companies
%test.xhandler.limits.max-unverified-companies=30

# Build-time switch for the P0 skeleton endpoint (DevDocumentResource): included in dev mode and
# tests only. hack/e2e.sh builds with -Dxhandler.dev-endpoints.enabled=true.
xhandler.dev-endpoints.enabled=false
%dev.xhandler.dev-endpoints.enabled=true
%test.xhandler.dev-endpoints.enabled=true
