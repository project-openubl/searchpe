# Monitoring (DESIGN.md §18, §26.4): needs the Prometheus Operator CRDs and a
# Grafana sidecar that loads dashboards from labelled ConfigMaps.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - podmonitor.yaml
  - prometheusrule.yaml
configMapGenerator:
  - name: xhandler-dashboards
    files:
      - dashboards/xhandler-slo.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
