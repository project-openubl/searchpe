# Database migrations (DESIGN.md §15.1): run once per release, before the new
# pods, as the schema owner (the app itself runs as a non-owner member of
# xhandler_app and never migrates). Expand/contract keeps the old pods working
# while this runs. Argo CD runs it as a PreSync hook.
apiVersion: batch/v1
kind: Job
metadata:
  name: xhandler-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xhandler-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: xhandler-service
          env:
            - name: QUARKUS_FLYWAY_MIGRATE_AT_START
              value: "true"
            # Run the init tasks (Flyway) and exit before the application starts: no workers,
            # no HTTP server, no role check (this login is the owner on purpose)
            - name: QUARKUS_INIT_AND_EXIT
              value: "true"
            - name: XHANDLER_ROLE
              value: migrate
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              valueFrom:
                configMapKeyRef: { name: xhandler-config, key: oidc-auth-server-url }
            - name: QUARKUS_DATASOURCE_JDBC_URL
              valueFrom:
                secretKeyRef: { name: xhandler-db-owner, key: jdbc-url }
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: { name: xhandler-db-owner, key: username }
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: xhandler-db-owner, key: password }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
# The migration pod reaches DNS and the database only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: xhandler-migrate
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: xhandler-migrate
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - ipBlock:
            cidr: 169.254.20.10/32
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: xhandler-db
      ports:
        - { port: 5432, protocol: TCP }
