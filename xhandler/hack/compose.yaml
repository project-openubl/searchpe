# Local dependencies for running the packaged app and the e2e test.
# (`./mvnw quarkus:dev` starts PostgreSQL by itself through Dev Services.)
services:
  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_DB: xhandler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:Z
    ports:
      - "5432:5432"

  # Keycloak with the dev realm (users alice, bob, carol, dave; client acme-erp)
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ../deploy/keycloak/xhandler-realm-dev.json:/opt/keycloak/data/import/xhandler-realm.json:Z
    ports:
      - "8180:8080"

  # Grafana + Tempo + Prometheus + Loki with an OpenTelemetry collector
  # (http://localhost:3000). OTLP: gRPC 4317, HTTP 4318. Tempo API: 3200.
  lgtm:
    image: docker.io/grafana/otel-lgtm:0.41.0
    ports:
      - "3000:3000"
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
