{{- $secretName := printf "%s-session" (include "searchpe.fullname" .) -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingKey := index ($existingSecret.data | default dict) "encryption-key" -}}
{{- if and .Values.sessionEncryptionKey (lt (len .Values.sessionEncryptionKey) 16) }}
{{- fail "sessionEncryptionKey must be at least 16 characters" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "searchpe.labels" . | nindent 4 }}
type: Opaque
{{- /*
Precedence: the explicit value, then the key already in the cluster (so upgrades don't log users out), then a new
random key. Uses `data` rather than `stringData` because the looked-up value is already base64-encoded.
*/}}
data:
  {{- if .Values.sessionEncryptionKey }}
  encryption-key: {{ .Values.sessionEncryptionKey | b64enc | quote }}
  {{- else if $existingKey }}
  encryption-key: {{ $existingKey | quote }}
  {{- else }}
  encryption-key: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
