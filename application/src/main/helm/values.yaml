---
replicaCount: 1

image:
  repository: quay.io/projectopenubl/searchpe
  pullPolicy: IfNotPresent
  tag: "${helm.image.tag}"

nameOverride: ""
fullnameOverride: ""

podAnnotations: { }

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  annotations: { }
  hosts:
    - host: chart-example.local
      paths: [ ]
  tls: [ ]

# The JVM runs with a fixed 384 MiB heap (set in the image) plus about 200 MiB of non-heap memory. The daily import is
# CPU-bound for a few minutes, so a low CPU limit throttles it.
resources:
  limits:
    cpu: "1"
    memory: 768Mi
  requests:
    cpu: 100m
    memory: 600Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: { }

tolerations: [ ]

affinity: { }

database:
  hostname:
  port: 5432
  database: searchpe_db
  username: db_username
  password: db_password

# Key that encrypts the form-login cookie (at least 16 characters). Leave it empty to generate a random key on install,
# which is kept on upgrades. Set it explicitly when rendering with `helm template` or GitOps tools (e.g. Argo CD): they
# can't look up the existing Secret, so a new key would be generated on every sync. Pods must be restarted after
# changing it.
sessionEncryptionKey: ""

# Additional environment variables for Searchpe mapped from Secret or ConfigMap
extraEnvFrom: ""

openshift:
  enabled: false